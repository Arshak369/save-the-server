<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save the Server</title>
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --slate-950: #020617;
    --slate-900: #0f172a;
    --slate-800: #1e293b;
    --slate-700: #334155;
    --slate-500: #64748b;
    --slate-400: #94a3b8;
    --slate-300: #cbd5e1;
    --slate-100: #f1f5f9;
    --cyan-400: #22d3ee;
    --cyan-500: #06b6d4;
    --cyan-300: #67e8f9;
    --emerald-400: #34d399;
    --emerald-950: #022c22;
    --amber-400: #fbbf24;
    --rose-500: #f43f5e;
    --rose-950: #4c0519;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    background-color: var(--slate-950);
    color: var(--slate-100);
  }

  .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }

  #app {
    width: 100%;
    min-height: 100vh;
    background-color: var(--slate-950);
    color: var(--slate-100);
    display: flex;
    flex-direction: column;
    user-select: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 34px 34px;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    color: inherit;
  }
  button:focus-visible {
    outline: none;
    box-shadow: 0 0 0 4px var(--cyan-300);
  }

  /* ---------- Start / End screens ---------- */
  .center-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    gap: 24px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--cyan-400);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }

  .title-hero {
    font-size: 44px;
    font-weight: 900;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .title-hero .accent { color: var(--cyan-400); }
  @media (min-width: 768px) { .title-hero { font-size: 72px; } }

  .subtitle {
    max-width: 640px;
    color: var(--slate-400);
    font-size: 15px;
  }
  @media (min-width: 768px) { .subtitle { font-size: 18px; } }

  .stat-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    color: var(--slate-500);
    font-size: 13px;
  }

  .big-button {
    margin-top: 16px;
    padding: 20px 40px;
    background-color: var(--cyan-500);
    color: var(--slate-950);
    font-weight: 900;
    font-size: 20px;
    border: none;
    border-radius: 16px;
    transition: transform 0.1s, background-color 0.2s;
    box-shadow: 0 0 40px rgba(34,211,238,0.35);
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  .big-button:hover { background-color: var(--cyan-400); }
  .big-button:active { transform: scale(0.95); }

  .result-title {
    font-size: 40px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  @media (min-width: 768px) { .result-title { font-size: 64px; } }
  .result-title.saved { color: var(--emerald-400); }
  .result-title.crashed { color: var(--rose-500); }

  .rank-row {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--slate-300);
  }
  .rank-row span {
    font-size: 18px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .score-display {
    font-size: 56px;
    font-weight: 900;
    color: var(--cyan-400);
  }
  @media (min-width: 768px) { .score-display { font-size: 88px; } }
  .score-display .of100 { font-size: 22px; color: var(--slate-500); }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    width: 100%;
    max-width: 640px;
    margin-top: 8px;
  }
  @media (min-width: 640px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }

  .stat-card {
    background-color: var(--slate-900);
    border: 1px solid var(--slate-800);
    border-radius: 12px;
    padding: 12px;
  }
  .stat-card .label {
    color: var(--slate-500);
    font-size: 11px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .stat-card .value {
    font-size: 18px;
    font-weight: 700;
  }

  /* ---------- Playing screen ---------- */
  .play-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 12px;
  }
  @media (min-width: 768px) { .play-wrap { padding: 20px; gap: 16px; } }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .brand .name {
    color: var(--cyan-400);
    font-weight: 900;
    letter-spacing: -0.02em;
    font-size: 18px;
  }
  @media (min-width: 768px) { .brand .name { font-size: 24px; } }
  .brand .stage {
    color: var(--slate-500);
    font-size: 12px;
    text-transform: uppercase;
  }
  @media (min-width: 768px) { .brand .stage { font-size: 14px; } }

  .health-wrap {
    flex: 1;
    min-width: 220px;
    max-width: 448px;
  }
  .health-label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--slate-400);
    margin-bottom: 4px;
  }
  @media (min-width: 768px) { .health-label-row { font-size: 14px; } }
  .health-bar-track {
    height: 12px;
    width: 100%;
    background-color: var(--slate-800);
    border-radius: 999px;
    overflow: hidden;
  }
  @media (min-width: 768px) { .health-bar-track { height: 16px; } }
  .health-bar-fill {
    height: 100%;
    transition: width 0.5s, background-color 0.5s;
  }

  .timer-mute {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .timer {
    font-weight: 900;
    font-size: 32px;
  }
  @media (min-width: 768px) { .timer { font-size: 48px; } }
  .timer.danger { color: var(--rose-500); animation: pulse 1s infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .mute-btn {
    padding: 8px;
    border-radius: 10px;
    background-color: var(--slate-800);
    border: 1px solid var(--slate-700);
  }
  .mute-btn:hover { background-color: var(--slate-700); }
  .mute-btn svg { width: 20px; height: 20px; }

  .component-grid {
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  }
  @media (min-width: 768px) { .component-grid { gap: 16px; } }

  .comp-card {
    position: relative;
    background-color: var(--slate-900);
    border: 1px solid var(--slate-800);
    border-radius: 16px;
    padding: 12px;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  @media (min-width: 768px) { .comp-card { padding: 16px; } }
  .comp-card.red { border-color: var(--rose-500); box-shadow: 0 0 22px rgba(244,63,94,0.22); }

  .comp-card .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .comp-card .head .left {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--slate-300);
  }
  .comp-card .head .left svg { width: 16px; height: 16px; }
  .comp-card .head .left span {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 999px;
  }
  .comp-card .value-line {
    font-weight: 900;
    font-size: 20px;
    margin-bottom: 4px;
  }
  @media (min-width: 768px) { .comp-card .value-line { font-size: 28px; } }
  .comp-card .value-line .unit {
    font-size: 12px;
    margin-left: 4px;
    color: var(--slate-500);
  }
  .comp-card svg.sparkline {
    width: 100%;
    height: 26px;
  }

  .green-text { color: var(--emerald-400); }
  .yellow-text { color: var(--amber-400); }
  .red-text { color: var(--rose-500); }

  /* ---------- Incident modal ---------- */
  .incident-overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background-color: var(--slate-950);
  }

  .incident-box {
    width: 100%;
    max-width: 720px;
    background-color: var(--slate-900);
    border: 2px solid var(--rose-500);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 0 60px rgba(244,63,94,0.35);
  }
  @media (min-width: 768px) { .incident-box { padding: 32px; } }

  .incident-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .incident-head svg {
    width: 32px;
    height: 32px;
    color: var(--rose-500);
    animation: pulse 1s infinite;
  }
  @media (min-width: 768px) { .incident-head svg { width: 40px; height: 40px; } }
  .incident-head .alert-title {
    color: var(--rose-500);
    font-weight: 900;
    font-size: 24px;
    letter-spacing: -0.02em;
  }
  @media (min-width: 768px) { .incident-head .alert-title { font-size: 30px; } }
  .incident-head .incident-name {
    color: var(--slate-300);
    font-size: 14px;
    text-transform: uppercase;
  }
  @media (min-width: 768px) { .incident-head .incident-name { font-size: 16px; } }

  .incident-timer-track {
    height: 6px;
    width: 100%;
    background-color: var(--slate-800);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .incident-timer-fill {
    height: 100%;
    background-color: var(--rose-500);
    transition: width 1s linear;
  }

  .symptom-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }
  @media (min-width: 640px) { .symptom-grid { grid-template-columns: repeat(3, 1fr); } }

  .symptom-card {
    background-color: var(--slate-950);
    border: 1px solid var(--slate-800);
    border-radius: 12px;
    padding: 12px;
  }
  .symptom-card .label {
    color: var(--slate-500);
    font-size: 11px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .symptom-card .value {
    font-size: 18px;
    font-weight: 700;
  }
  @media (min-width: 768px) { .symptom-card .value { font-size: 20px; } }

  .actions-grid {
    display: grid;
    gap: 8px;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  }
  @media (min-width: 768px) { .actions-grid { gap: 12px; } }

  .action-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background-color: var(--slate-800);
    border: 1px solid var(--slate-700);
    border-radius: 12px;
    padding: 12px 8px;
    transition: transform 0.1s, background-color 0.15s, border-color 0.15s;
  }
  @media (min-width: 768px) { .action-btn { padding: 16px 8px; } }
  .action-btn:hover { background-color: var(--cyan-500); border-color: var(--cyan-400); }
  .action-btn:active { transform: scale(0.95); }
  .action-btn svg { width: 20px; height: 20px; }
  @media (min-width: 768px) { .action-btn svg { width: 24px; height: 24px; } }
  .action-btn span {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  @media (min-width: 768px) { .action-btn span { font-size: 14px; } }

  /* ---------- Feedback overlay ---------- */
  .feedback-overlay {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    padding: 16px;
  }
  .feedback-box {
    padding: 24px 32px;
    border-radius: 16px;
    border: 2px solid;
    text-align: center;
  }
  .feedback-box.correct { background-color: var(--emerald-950); border-color: var(--emerald-400); }
  .feedback-box.wrong { background-color: var(--rose-950); border-color: var(--rose-500); }
  .feedback-box .f-title {
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 4px;
  }
  @media (min-width: 768px) { .feedback-box .f-title { font-size: 34px; } }
  .feedback-box .f-title.correct { color: var(--emerald-400); }
  .feedback-box .f-title.wrong { color: var(--rose-500); }
  .feedback-box .f-msg {
    color: var(--slate-300);
    font-size: 14px;
    margin-bottom: 4px;
  }
  @media (min-width: 768px) { .feedback-box .f-msg { font-size: 16px; } }
  .feedback-box .f-delta {
    font-weight: 700;
    font-size: 18px;
  }
  .feedback-box .f-delta.correct { color: var(--emerald-400); }
  .feedback-box .f-delta.wrong { color: var(--rose-500); }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  // -------------------------------------------------------------------------
  // Static config — component dashboard + incident + action definitions
  // -------------------------------------------------------------------------

  const COMPONENT_DEFS = [
    { id: "cpu", label: "CPU", unit: "%", baseline: 34, icon: "cpu" },
    { id: "ram", label: "RAM", unit: "%", baseline: 47, icon: "memory-stick" },
    { id: "network", label: "Network", unit: "ms", baseline: 38, icon: "wifi" },
    { id: "database", label: "Database", unit: "ms", baseline: 110, icon: "database" },
    { id: "api", label: "API", unit: "ms", baseline: 85, icon: "server" },
    { id: "pipeline", label: "Data Pipeline", unit: "rec/s", baseline: 1180, icon: "workflow" },
    { id: "ai", label: "AI / ML Service", unit: "ms", baseline: 205, icon: "brain-circuit" },
  ];

  const BASELINE = Object.fromEntries(COMPONENT_DEFS.map((c) => [c.id, c.baseline]));

  const ACTIONS = [
    { id: "TRACE", label: "Trace", icon: "search" },
    { id: "RESTART", label: "Restart", icon: "rotate-ccw" },
    { id: "SCALE", label: "Scale", icon: "trending-up" },
    { id: "ROLLBACK", label: "Rollback", icon: "undo-2" },
    { id: "REPAIR", label: "Repair", icon: "wrench" },
    { id: "ISOLATE", label: "Isolate", icon: "shield-alert" },
    { id: "CLEANUP", label: "Cleanup", icon: "trash-2" },
    { id: "REDIRECT", label: "Redirect", icon: "route" },
    { id: "RETRAIN", label: "Retrain", icon: "brain" },
    { id: "RESTORE", label: "Restore", icon: "link-2" },
  ];

  const INCIDENTS = [
    {
      id: "cpu_spike", stage: 1, title: "CPU Spike", affects: ["cpu"], correctAction: "TRACE", severity: 2.7,
      symptoms: [
        { label: "CPU Utilization", value: "98%" },
        { label: "Active Processes", value: "347 (+210%)" },
        { label: "Thread Queue", value: "Critical" },
      ],
      resolveMsg: "Rogue process traced and killed. CPU load normalizing.",
      failMsg: "Wrong call — CPU load keeps climbing.",
    },
    {
      id: "memory_leak", stage: 1, title: "Memory Leak", affects: ["ram"], correctAction: "RESTART", severity: 1.9,
      symptoms: [
        { label: "RAM Usage", value: "94%" },
        { label: "Garbage Collection", value: "Stalled" },
        { label: "Allocation Rate", value: "+18 MB/s" },
      ],
      resolveMsg: "Service restarted. Memory reclaimed.",
      failMsg: "Leak untouched — RAM still climbing.",
    },
    {
      id: "network_congestion", stage: 1, title: "Network Congestion", affects: ["network"], correctAction: "REDIRECT", severity: 3.2,
      symptoms: [
        { label: "Network Latency", value: "890 ms" },
        { label: "Packet Loss", value: "12%" },
        { label: "Throughput", value: "-64%" },
      ],
      resolveMsg: "Traffic redirected. Latency dropping.",
      failMsg: "Congestion persists — packets still dropping.",
    },
    {
      id: "api_failure", stage: 1, title: "API Failure", affects: ["api"], correctAction: "RESTART", severity: 3.0,
      symptoms: [
        { label: "API Error Rate", value: "47%" },
        { label: "Failed Requests", value: "1,204" },
        { label: "Status Code", value: "503 x N" },
      ],
      resolveMsg: "API service restarted. Requests succeeding again.",
      failMsg: "Errors keep piling up.",
    },
    {
      id: "disk_full", stage: 1, title: "Disk Full", affects: ["database"], correctAction: "CLEANUP", severity: 1.6,
      symptoms: [
        { label: "Storage Used", value: "99%" },
        { label: "Write Operations", value: "Failing" },
        { label: "Free Space", value: "0.4 GB" },
      ],
      resolveMsg: "Old logs purged. Storage freed up.",
      failMsg: "Disk still critical — writes failing.",
    },
    {
      id: "db_overload", stage: 2, title: "Database Overload", affects: ["database"], correctAction: "SCALE", severity: 2.4,
      symptoms: [
        { label: "DB Response Time", value: "4.8 s" },
        { label: "Request Queue", value: "+340%" },
        { label: "Active Connections", value: "2,847" },
      ],
      resolveMsg: "Database scaled up. Response time recovering.",
      failMsg: "Database still buckling under load.",
    },
    {
      id: "db_connection", stage: 2, title: "Database Connection Failure", affects: ["api", "database"], correctAction: "RESTORE", severity: 2.0,
      symptoms: [
        { label: "API ↔ Database", value: "Disconnected" },
        { label: "Timeout Errors", value: "89/min" },
        { label: "Retry Attempts", value: "Exhausted" },
      ],
      resolveMsg: "Connection restored between services.",
      failMsg: "Services still can't reach each other.",
    },
    {
      id: "pipeline_failure", stage: 2, title: "Data Pipeline Failure", affects: ["pipeline"], correctAction: "REPAIR", severity: 0.05,
      symptoms: [
        { label: "Incoming Records", value: "0 / min" },
        { label: "Pipeline Status", value: "Stalled" },
        { label: "Last Sync", value: "6 min ago" },
      ],
      resolveMsg: "Pipeline repaired. Records flowing again.",
      failMsg: "Pipeline still stalled.",
    },
    {
      id: "corrupted_data", stage: 2, title: "Corrupted Data", affects: ["pipeline", "database"], correctAction: "ROLLBACK", severity: 2.2,
      symptoms: [
        { label: "Validation Errors", value: "+215%" },
        { label: "Schema Mismatches", value: "38" },
        { label: "Data Integrity", value: "Compromised" },
      ],
      resolveMsg: "Rolled back to last clean snapshot.",
      failMsg: "Corruption spreading further.",
    },
    {
      id: "ml_drift", stage: 3, title: "ML Model Drift", affects: ["ai"], correctAction: "RETRAIN", severity: 2.6,
      symptoms: [
        { label: "Prediction Accuracy", value: "-31%" },
        { label: "Confidence Score", value: "0.41" },
        { label: "Input Distribution", value: "Shifted" },
      ],
      resolveMsg: "Model retrained on fresh data. Accuracy back up.",
      failMsg: "Model still drifting.",
    },
    {
      id: "ai_overload", stage: 3, title: "AI Inference Overload", affects: ["ai"], correctAction: "SCALE", severity: 3.4,
      symptoms: [
        { label: "Inference Latency", value: "6.2 s" },
        { label: "GPU Utilization", value: "100%" },
        { label: "Request Backlog", value: "1,830" },
      ],
      resolveMsg: "AI service scaled out. Latency dropping.",
      failMsg: "Inference queue keeps growing.",
    },
    {
      id: "iot_sensor", stage: 3, title: "IoT Sensor Failure", affects: ["pipeline"], correctAction: "ISOLATE", severity: 0.35,
      symptoms: [
        { label: "Sensor Readings", value: "Erratic" },
        { label: "Anomaly Score", value: "0.97" },
        { label: "Device Status", value: "Unstable" },
      ],
      resolveMsg: "Faulty sensor isolated. Feed stabilizing.",
      failMsg: "Bad data still flooding the pipeline.",
    },
  ];

  const STAGE_NAME = { 1: "Infrastructure", 2: "Data", 3: "Deep Tech" };

  const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

  function createInitialState() {
    const components = {};
    COMPONENT_DEFS.forEach((def) => {
      components[def.id] = {
        value: def.baseline,
        history: Array(18).fill(def.baseline),
        status: "green",
        forcedTarget: null,
      };
    });
    return {
      health: 100,
      timeLeft: 60,
      incidentsSolved: 0,
      wrongActions: 0,
      responseTimes: [],
      activeIncident: null,
      incidentTimeLeft: 0,
      incidentTotalTimeout: 1,
      spawnCountdown: 4,
      lastIncidentId: null,
      components,
    };
  }

  function getStage(timeLeft) {
    const elapsed = 60 - timeLeft;
    return elapsed < 20 ? 1 : elapsed < 40 ? 2 : 3;
  }

  // -------------------------------------------------------------------------
  // App state
  // -------------------------------------------------------------------------

  let screen = "start"; // "start" | "playing" | "ended"
  let s = createInitialState();
  let feedback = null;
  let finalResult = null;
  let muted = false;
  let audioCtx = null;
  let feedbackTimer = null;
  let mainInterval = null;
  let fastInterval = null;

  const app = document.getElementById("app");

  // -------------------------------------------------------------------------
  // Audio
  // -------------------------------------------------------------------------

  function beep(freq, duration, type, vol, delay) {
    type = type || "sine";
    vol = vol == null ? 0.18 : vol;
    delay = delay || 0;
    if (muted) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = audioCtx;
      const t0 = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(vol, t0);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + duration + 0.02);
    } catch (e) { /* audio unavailable, fail silently */ }
  }

  function playSound(name) {
    switch (name) {
      case "alert": beep(880, 0.12, "square", 0.12); beep(660, 0.14, "square", 0.12, 0.14); break;
      case "correct": beep(660, 0.08, "sine", 0.16); beep(990, 0.12, "sine", 0.16, 0.09); break;
      case "wrong": beep(180, 0.28, "sawtooth", 0.18); break;
      case "success": beep(523, 0.14, "sine", 0.17); beep(659, 0.14, "sine", 0.17, 0.14); beep(784, 0.24, "sine", 0.17, 0.28); break;
      case "fail": beep(300, 0.2, "sawtooth", 0.15); beep(220, 0.32, "sawtooth", 0.15, 0.2); break;
      default: break;
    }
  }

  // -------------------------------------------------------------------------
  // Game logic
  // -------------------------------------------------------------------------

  function spawnIncident() {
    const stage = getStage(s.timeLeft);
    let pool = INCIDENTS.filter((i) => i.stage === stage && i.id !== s.lastIncidentId);
    if (pool.length === 0) pool = INCIDENTS.filter((i) => i.stage === stage);
    const incident = pool[Math.floor(Math.random() * pool.length)];
    s.lastIncidentId = incident.id;
    s.activeIncident = { incident, spawnedAt: Date.now() };
    const timeout = stage === 1 ? 9 : stage === 2 ? 8 : 7;
    s.incidentTimeLeft = timeout;
    s.incidentTotalTimeout = timeout;
    incident.affects.forEach((id) => {
      s.components[id].forcedTarget = BASELINE[id] * incident.severity;
    });
    playSound("alert");
  }

  function handleAction(actionId) {
    if (!s.activeIncident) return;
    const incident = s.activeIncident.incident;
    const spawnedAt = s.activeIncident.spawnedAt;
    const responseTime = (Date.now() - spawnedAt) / 1000;
    const correct = actionId === incident.correctAction;

    if (correct) {
      s.health = Math.min(100, s.health + 10);
      s.incidentsSolved += 1;
      s.responseTimes.push(responseTime);
    } else {
      s.health = Math.max(0, s.health - 10);
      s.wrongActions += 1;
      if (actionId) s.responseTimes.push(responseTime);
    }

    incident.affects.forEach((id) => { s.components[id].forcedTarget = null; });
    s.activeIncident = null;
    const stage = getStage(s.timeLeft);
    s.spawnCountdown = stage === 1 ? 5 + Math.floor(Math.random() * 3)
      : stage === 2 ? 4 + Math.floor(Math.random() * 3)
      : 3 + Math.floor(Math.random() * 3);

    clearTimeout(feedbackTimer);
    feedback = {
      type: correct ? "correct" : "wrong",
      title: correct ? "System Stabilized" : "Action Failed",
      msg: correct ? incident.resolveMsg : incident.failMsg,
      delta: correct ? "+10 HEALTH" : "-10 HEALTH",
    };
    feedbackTimer = setTimeout(() => { feedback = null; render(); }, 1400);
    playSound(correct ? "correct" : "wrong");
    render();
  }

  function finishGame(result) {
    s.activeIncident = null;
    const timeSurvived = result === "crashed" ? 60 - s.timeLeft : 60;
    const avgResp = s.responseTimes.length
      ? s.responseTimes.reduce((a, b) => a + b, 0) / s.responseTimes.length
      : null;
    const speedBonus = avgResp != null ? clamp(15 - avgResp * 1.5, 0, 15) : 0;
    let score = s.health * 0.35 + s.incidentsSolved * 5.5 + (timeSurvived / 60) * 15 + speedBonus - s.wrongActions * 6;
    score = Math.round(clamp(score, 0, 100));
    const rank = score >= 90 ? "System Saviour" : score >= 75 ? "Tech Commander" : score >= 50 ? "Incident Responder" : "System Trainee";
    finalResult = {
      result, score, rank,
      health: Math.round(s.health),
      incidentsSolved: s.incidentsSolved,
      wrongActions: s.wrongActions,
      timeSurvived,
    };
    playSound(result === "saved" ? "success" : "fail");
    screen = "ended";
    stopTicks();
    render();
  }

  function mainTick() {
    s.timeLeft -= 1;
    if (s.activeIncident) {
      s.incidentTimeLeft -= 1;
      if (s.incidentTimeLeft <= 0) { handleAction(null); }
    } else {
      s.spawnCountdown -= 1;
      if (s.spawnCountdown <= 0) spawnIncident();
    }
    if (s.health <= 0) { finishGame("crashed"); return; }
    if (s.timeLeft <= 0) { finishGame(s.health > 0 ? "saved" : "crashed"); return; }
    render();
  }

  function fastTick() {
    Object.values(s.components).forEach((c) => {
      if (c.forcedTarget != null) {
        c.value = c.value + (c.forcedTarget - c.value) * 0.35 + (Math.random() - 0.5) * c.forcedTarget * 0.04;
        c.status = "red";
      } else {
        c.value = c.value + (c.baseline - c.value) * 0.12 + (Math.random() - 0.5) * c.baseline * 0.06;
        const dev = Math.abs(c.value - c.baseline) / (c.baseline || 1);
        c.status = dev > 0.18 ? "yellow" : "green";
      }
      c.history.push(c.value);
      if (c.history.length > 18) c.history.shift();
    });
    render();
  }

  function stopTicks() {
    clearInterval(mainInterval);
    clearInterval(fastInterval);
    mainInterval = null;
    fastInterval = null;
  }

  function startTicks() {
    stopTicks();
    mainInterval = setInterval(mainTick, 1000);
    fastInterval = setInterval(fastTick, 350);
  }

  function handleStart() {
    s = createInitialState();
    finalResult = null;
    feedback = null;
    screen = "playing";
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } else if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    } catch (e) { /* ignore */ }
    startTicks();
    render();
  }

  function toggleMute() {
    muted = !muted;
    render();
  }

  // -------------------------------------------------------------------------
  // Rendering helpers
  // -------------------------------------------------------------------------

  function icon(name, extraAttrs) {
    return `<i data-lucide="${name}" ${extraAttrs || ""}></i>`;
  }

  function sparklinePoints(history) {
    const w = 100, h = 28;
    const min = Math.min.apply(null, history);
    const max = Math.max.apply(null, history);
    const range = max - min || 1;
    return history
      .map((v, i) => `${(i / (history.length - 1)) * w},${h - ((v - min) / range) * h}`)
      .join(" ");
  }

  function toneFor(status) {
    if (status === "red") return { dotColor: "var(--rose-500)", textClass: "red-text", cardClass: "red", glow: "rgba(244,63,94,0.85)" };
    if (status === "yellow") return { dotColor: "var(--amber-400)", textClass: "yellow-text", cardClass: "", glow: "rgba(251,191,36,0.6)" };
    return { dotColor: "var(--emerald-400)", textClass: "green-text", cardClass: "", glow: "rgba(52,211,153,0.55)" };
  }

  function renderComponentCard(def, data) {
    const tone = toneFor(data.status);
    return `
      <div class="comp-card ${tone.cardClass}">
        <div class="head">
          <div class="left">
            ${icon(def.icon)}
            <span>${def.label}</span>
          </div>
          <span class="status-dot" style="background-color:${tone.dotColor}; box-shadow: 0 0 8px ${tone.glow};"></span>
        </div>
        <div class="value-line ${tone.textClass}">
          ${Math.round(data.value).toLocaleString()}<span class="unit">${def.unit}</span>
        </div>
        <svg class="sparkline ${tone.textClass}" viewBox="0 0 100 28" preserveAspectRatio="none">
          <polyline points="${sparklinePoints(data.history)}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
    `;
  }

  function renderStartScreen() {
    return `
      <div class="center-screen">
        <div class="eyebrow">${icon("activity")} Live Systems Monitor</div>
        <h1 class="title-hero">SAVE THE <span class="accent">SERVER</span></h1>
        <p class="subtitle">You're on call. Incidents will hit CPU, memory, network, the database, the pipeline and the AI service — read the symptoms, pick the right fix, and keep the system alive for 60 seconds.</p>
        <div class="stat-row mono">
          <span>7 LIVE COMPONENTS</span><span>·</span><span>12 INCIDENT TYPES</span><span>·</span><span>60 SECONDS</span>
        </div>
        <button class="big-button" id="startBtn">START SHIFT</button>
      </div>
    `;
  }

  function renderEndScreen(result) {
    if (!result) return "";
    const saved = result.result === "saved";
    const stats = [
      { label: "System Health", value: `${result.health}%` },
      { label: "Incidents Solved", value: result.incidentsSolved },
      { label: "Wrong Actions", value: result.wrongActions },
      { label: "Time Survived", value: `${result.timeSurvived}s` },
    ];
    return `
      <div class="center-screen">
        <div class="result-title ${saved ? "saved" : "crashed"}">${saved ? "SERVER SAVED!" : "SERVER CRASHED!"}</div>
        <div class="rank-row">
          ${icon("trophy", 'style="width:20px;height:20px;color:var(--amber-400);"')}
          <span class="mono">${result.rank}</span>
        </div>
        <div class="score-display mono">${result.score}<span class="of100">/100</span></div>
        <div class="stats-grid">
          ${stats.map((st) => `
            <div class="stat-card">
              <div class="label mono">${st.label}</div>
              <div class="value mono">${st.value}</div>
            </div>
          `).join("")}
        </div>
        <button class="big-button" id="replayBtn">${icon("rotate-ccw", 'style="width:24px;height:24px;"')} PLAY AGAIN</button>
      </div>
    `;
  }

  function renderPlayingScreen() {
    const stage = getStage(s.timeLeft);
    const healthColor = s.health > 60 ? "var(--emerald-400)" : s.health > 30 ? "var(--amber-400)" : "var(--rose-500)";

    let html = `
      <div class="play-wrap">
        <div class="top-bar">
          <div class="brand">
            <span class="name">SAVE THE SERVER</span>
            <span class="stage mono">Stage ${stage} · ${STAGE_NAME[stage]}</span>
          </div>

          <div class="health-wrap">
            <div class="health-label-row mono">
              <span>System Health</span>
              <span style="color:${healthColor};">${Math.round(s.health)}%</span>
            </div>
            <div class="health-bar-track">
              <div class="health-bar-fill" style="width:${Math.max(0, s.health)}%; background-color:${healthColor};"></div>
            </div>
          </div>

          <div class="timer-mute">
            <div class="timer mono ${s.timeLeft <= 10 ? "danger" : ""}">${Math.max(0, s.timeLeft)}</div>
            <button class="mute-btn" id="muteBtn" aria-label="${muted ? "Unmute" : "Mute"}">
              ${muted ? icon("volume-x", 'style="color:var(--slate-400);"') : icon("volume-2", 'style="color:var(--slate-300);"')}
            </button>
          </div>
        </div>

        <div class="component-grid">
          ${COMPONENT_DEFS.map((def) => renderComponentCard(def, s.components[def.id])).join("")}
        </div>

        <div style="flex:1;"></div>
      </div>
    `;

    if (s.activeIncident) {
      const incident = s.activeIncident.incident;
      html += `
        <div class="incident-overlay" role="alertdialog" aria-live="assertive">
          <div class="incident-box">
            <div class="incident-head">
              ${icon("alert-triangle")}
              <div>
                <div class="alert-title">CRITICAL ALERT</div>
                <div class="incident-name mono">${incident.title}</div>
              </div>
            </div>

            <div class="incident-timer-track">
              <div class="incident-timer-fill" style="width:${(s.incidentTimeLeft / s.incidentTotalTimeout) * 100}%;"></div>
            </div>

            <div class="symptom-grid">
              ${incident.symptoms.map((sym) => `
                <div class="symptom-card">
                  <div class="label mono">${sym.label}</div>
                  <div class="value mono">${sym.value}</div>
                </div>
              `).join("")}
            </div>

            <div class="actions-grid">
              ${ACTIONS.map((a) => `
                <button class="action-btn" data-action="${a.id}">
                  ${icon(a.icon)}
                  <span>${a.label}</span>
                </button>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    if (feedback) {
      html += `
        <div class="feedback-overlay">
          <div class="feedback-box ${feedback.type}">
            <div class="f-title ${feedback.type}">${feedback.type === "correct" ? "✓ " : "✕ "}${feedback.title}</div>
            <div class="f-msg">${feedback.msg}</div>
            <div class="f-delta ${feedback.type} mono">${feedback.delta}</div>
          </div>
        </div>
      `;
    }

    return html;
  }

  // -------------------------------------------------------------------------
  // Main render + event wiring
  // -------------------------------------------------------------------------

  function render() {
    let html = "";
    if (screen === "start") html = renderStartScreen();
    else if (screen === "ended") html = renderEndScreen(finalResult);
    else if (screen === "playing") html = renderPlayingScreen();

    app.innerHTML = html;

    if (window.lucide) lucide.createIcons();

    if (screen === "start") {
      const btn = document.getElementById("startBtn");
      if (btn) btn.addEventListener("click", handleStart);
    } else if (screen === "ended") {
      const btn = document.getElementById("replayBtn");
      if (btn) btn.addEventListener("click", handleStart);
    } else if (screen === "playing") {
      const muteBtn = document.getElementById("muteBtn");
      if (muteBtn) muteBtn.addEventListener("click", toggleMute);
      document.querySelectorAll(".action-btn").forEach((btn) => {
        btn.addEventListener("click", () => handleAction(btn.getAttribute("data-action")));
      });
    }
  }

  render();
})();
</script>
</body>
</html>
